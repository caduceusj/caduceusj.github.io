<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="João Anisio Marinho da Nobrega - Game Developer Portfolio. Game Programmer specializing in Godot and Unity.">
    <title>JoãoOS - Game Developer Portfolio</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Boot Screen -->
    <div id="boot-screen">
        <div class="boot-content">
            <div class="boot-logo">JoãoOS</div>
            <div class="boot-subtitle">Game Developer Edition</div>
            <div class="boot-loader">
                <div class="boot-progress"></div>
            </div>
        </div>
    </div>

    <!-- Desktop -->
    <div id="desktop">
        <div id="desktop-icons"></div>
        <div id="windows-container"></div>
    </div>

    <!-- Start Menu -->
    <div id="start-menu" class="hidden">
        <div class="start-menu-header">
            <img src="assets/Eu.jpg" alt="João Anisio" class="start-menu-avatar">
            <div>
                <div class="start-menu-name">João Anisio</div>
                <div class="start-menu-role">Game Programmer & Designer</div>
            </div>
        </div>
        <div class="start-menu-items" id="start-menu-items"></div>
        <div class="start-menu-footer">
            <a href="https://github.com/caduceusj" target="_blank" rel="noopener noreferrer"><i class="fab fa-github"></i></a>
            <a href="https://www.linkedin.com/in/joão-anisio-marinho-da-nobrega-096358204/" target="_blank" rel="noopener noreferrer"><i class="fab fa-linkedin"></i></a>
            <a href="https://caduceusj.itch.io/" target="_blank" rel="noopener noreferrer"><i class="fab fa-itch-io"></i></a>
        </div>
    </div>

    <!-- Taskbar -->
    <div id="taskbar">
        <button id="start-btn">
            <i class="fas fa-gamepad"></i>
            <span>Start</span>
        </button>
        <div class="taskbar-divider"></div>
        <div id="taskbar-apps"></div>
        <div id="system-tray">
            <div id="clock"></div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
